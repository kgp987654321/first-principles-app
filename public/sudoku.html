<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku Challenge</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#202331;background:#f7f8fc}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:980px;margin:auto}.card{background:linear-gradient(135deg,#fffdf5,#f4f1ff);border:2px solid #e7defc;border-radius:24px;padding:22px;box-shadow:0 18px 45px #2d27551a}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.head small{font-weight:950;letter-spacing:.08em;color:#6d5dfc}.head h1{margin:4px 0 6px;font-size:clamp(30px,6vw,48px)}.head p{margin:0;color:#697282}.reward{padding:10px 14px;border-radius:16px;background:#fff3bd;border:2px solid #f1d467;font-weight:950;white-space:nowrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{min-height:42px;border-radius:999px;padding:8px 14px;border:2px solid #dedbea;background:#fff;font-weight:900}.tabs button.active{border-color:#6d5dfc;background:#ece9ff;color:#4b3fd0}.tabs button:disabled{opacity:.55}.body{display:grid;grid-template-columns:minmax(240px,330px) 1fr;gap:30px;align-items:center}.grid4{display:grid;grid-template-columns:repeat(4,1fr);aspect-ratio:1;border:5px solid #3f3b58;border-radius:18px;overflow:hidden;background:#3f3b58;gap:2px}.grid9{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;border:5px solid #343145;border-radius:16px;overflow:hidden;background:#c8c7d2;gap:1px;max-width:560px}.cell{border:0;background:#fff;font-weight:950;color:#5e50dc;cursor:pointer}.grid4 .cell{font-size:clamp(28px,5vw,42px)}.grid9 .cell{font-size:clamp(15px,2.2vw,26px);min-height:0;aspect-ratio:1;padding:0}.cell.given{background:#eeeaf8;color:#363348;cursor:default}.cell.sel{background:#fff3b5;box-shadow:inset 0 0 0 3px #f0c63b}.boxRight{border-right:5px solid #3f3b58!important}.boxBottom{border-bottom:5px solid #3f3b58!important}.grid9 .boxRight{border-right-color:#343145!important}.grid9 .boxBottom{border-bottom-color:#343145!important}.instructions p{line-height:1.5;color:#5f6872}.message{padding:12px 14px;border-radius:13px;background:#f2f3f7;font-weight:800}.message.won{background:#e5f8dd;color:#315f2c}.actions{display:flex;gap:10px;margin-top:12px}.actions button,.back{flex:1;min-height:48px;border-radius:14px;border:1px solid #d7d9df;background:white;font-weight:850;font-size:16px;cursor:pointer}.actions .primary{background:#6d5dfc;color:white;border-color:#6d5dfc}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.pad button{min-height:54px;font-size:22px;font-weight:950;border:2px solid #ddd8f6;background:#fff;border-radius:12px}.back{display:block;width:100%;margin-top:16px;text-align:center;padding:14px;text-decoration:none;color:#444}@media(max-width:760px){body{padding:12px}.body{grid-template-columns:1fr}.grid4{width:min(100%,320px);margin:auto}.grid9{width:min(100%,560px);margin:auto}.head{align-items:flex-start}}
</style></head><body><main class="wrap"><section class="card"><div class="head"><div><small>DAILY LOGIC BONUS</small><h1>Sudoku Challenge</h1><p>Solve the 4×4 warm-up, then keep going with a full 9×9 puzzle.</p></div><div id="reward" class="reward">🪙 +50</div></div><div class="tabs"><button id="miniTab" class="active">4×4 Warm-up</button><button id="hardTab" disabled>9×9 Harder</button></div><div class="body"><div id="grid" class="grid4"></div><div class="instructions"><h2 id="modeTitle">Warm-up: 4×4</h2><p id="how">Use 1–4 exactly once in every row, every column, and each 2×2 box.</p><div id="pad" class="pad" hidden></div><p id="message" class="message"></p><div class="actions"><button id="reset">Reset</button><button id="check" class="primary">Check puzzle</button></div><a class="back" href="./">← Back to First Principles</a></div></div></section></main><script>
const MINI=[{g:[[1,0,0,4],[0,4,1,0],[0,1,4,0],[4,0,0,1]],s:[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]]},{g:[[0,2,0,4],[3,0,1,0],[0,1,0,3],[4,0,2,0]],s:[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]]}];
const HARD=[{g:[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]],s:[[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]]}];
const d=new Date(),day=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),hash=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0),easyKey='first-principles-sudoku-bonus',hardKey='first-principles-sudoku-hard-bonus',pendingKey='first-principles-pending-coins';
const mini=MINI[hash(day)%MINI.length],hard=HARD[hash(day+'hard')%HARD.length],grid=document.getElementById('grid'),msg=document.getElementById('message'),check=document.getElementById('check'),reset=document.getElementById('reset'),miniTab=document.getElementById('miniTab'),hardTab=document.getElementById('hardTab'),modeTitle=document.getElementById('modeTitle'),how=document.getElementById('how'),pad=document.getElementById('pad'),reward=document.getElementById('reward');
let easyWon=localStorage.getItem(easyKey)===day,hardWon=localStorage.getItem(hardKey)===day,mode=easyWon?'hard':'mini',p=mode==='mini'?mini:hard,board=p.g.map(r=>[...r]),selected=null;
function addCoins(n){const cur=Math.max(0,Number(localStorage.getItem(pendingKey)||0));localStorage.setItem(pendingKey,String(cur+n))}
function switchMode(next){if(next==='hard'&&!easyWon)return;mode=next;p=mode==='mini'?mini:hard;board=p.g.map(r=>[...r]);selected=null;render()}
function render(){grid.innerHTML='';grid.className=mode==='mini'?'grid4':'grid9';const won=mode==='mini'?easyWon:hardWon;board.forEach((row,r)=>row.forEach((v,c)=>{const b=document.createElement('button');const bigRight=mode==='mini'?c===1:c===2||c===5,bigBottom=mode==='mini'?r===1:r===2||r===5;b.className='cell '+(p.g[r][c]?'given ':'')+(bigBottom?'boxBottom ':'')+(bigRight?'boxRight ':'')+(selected&&selected[0]===r&&selected[1]===c?'sel':'');b.textContent=v||'';b.disabled=!!p.g[r][c]||won;b.onclick=()=>{if(mode==='mini'){board[r][c]=(board[r][c]%4)+1;msg.textContent='Keep going — each number appears once in every row, column, and 2×2 box.'}else{selected=[r,c]}render()};grid.appendChild(b)}));miniTab.className=mode==='mini'?'active':'';hardTab.className=mode==='hard'?'active':'';hardTab.disabled=!easyWon;miniTab.textContent='4×4 Warm-up '+(easyWon?'✓':'');hardTab.textContent='9×9 Harder '+(hardWon?'✓':easyWon?'Unlocked':'Solve 4×4 first');modeTitle.textContent=mode==='mini'?'Warm-up: 4×4':'Hard mode: Full 9×9';how.textContent=mode==='mini'?'Use 1–4 exactly once in every row, every column, and each 2×2 box.':'Use 1–9 exactly once in every row, every column, and each 3×3 box.';reward.textContent=mode==='mini'?'🪙 +50':'🪙 +100';pad.hidden=mode==='mini';pad.innerHTML='';if(mode==='hard'){[1,2,3,4,5,6,7,8,9].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.disabled=hardWon;b.onclick=()=>{if(!selected)return;board[selected[0]][selected[1]]=n;render()};pad.appendChild(b)});const e=document.createElement('button');e.textContent='Erase';e.disabled=hardWon;e.onclick=()=>{if(selected)board[selected[0]][selected[1]]=0;render()};pad.appendChild(e)}check.disabled=won;reset.disabled=won;check.textContent=won?(mode==='mini'?'Solved ✓':'Hard bonus earned ✓'):(mode==='mini'?'Check warm-up':'Check 9×9');msg.className='message'+(won?' won':'');msg.textContent=won?(mode==='mini'?'Warm-up complete ✓ The 9×9 challenge is ready.':'Today’s 9×9 challenge is complete ✓'):mode==='mini'?'Fill every row, column, and 2×2 box with 1, 2, 3, and 4.':'Select an empty square, then choose a number 1–9.'}
check.onclick=()=>{const ok=board.every((row,r)=>row.every((v,c)=>v===p.s[r][c]));if(!ok){msg.textContent=mode==='mini'?'Not quite yet. Check rows, columns, and the four 2×2 boxes.':'Not quite yet. Check rows, columns, and the 3×3 boxes.';return}if(mode==='mini'&&!easyWon){localStorage.setItem(easyKey,day);addCoins(50);easyWon=true;mode='hard';p=hard;board=p.g.map(r=>[...r]);selected=null}else if(mode==='hard'&&!hardWon){localStorage.setItem(hardKey,day);addCoins(100);hardWon=true}render()};
reset.onclick=()=>{board=p.g.map(r=>[...r]);selected=null;render()};miniTab.onclick=()=>switchMode('mini');hardTab.onclick=()=>switchMode('hard');render();
</script></body></html>
