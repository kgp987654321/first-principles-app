<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Sudoku</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#202331;background:#f7f8fc}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:760px;margin:auto}.card{background:linear-gradient(135deg,#fffdf5,#f4f1ff);border:2px solid #e7defc;border-radius:24px;padding:22px;box-shadow:0 18px 45px #2d27551a}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.head small{font-weight:950;letter-spacing:.08em;color:#6d5dfc}.head h1{margin:4px 0 6px;font-size:clamp(30px,6vw,48px)}.head p{margin:0;color:#697282}.reward{padding:10px 14px;border-radius:16px;background:#fff3bd;border:2px solid #f1d467;font-weight:950;white-space:nowrap}.body{display:grid;grid-template-columns:minmax(240px,330px) 1fr;gap:30px;align-items:center;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);aspect-ratio:1;border:5px solid #3f3b58;border-radius:18px;overflow:hidden;background:#3f3b58;gap:2px;box-shadow:0 12px 26px #362f581f}.cell{border:0;background:#fff;font-size:clamp(28px,5vw,42px);font-weight:950;color:#5e50dc;cursor:pointer}.cell.given{background:#eeeaf8;color:#363348;cursor:default}.cell.boxRight{border-right:5px solid #3f3b58}.cell.boxBottom{border-bottom:5px solid #3f3b58}.instructions p{line-height:1.5;color:#5f6872}.message{padding:12px 14px;border-radius:13px;background:#f2f3f7;font-weight:800}.message.won{background:#e5f8dd;color:#315f2c}.actions{display:flex;gap:10px;margin-top:12px}.actions button,.back{flex:1;min-height:48px;border-radius:14px;border:1px solid #d7d9df;background:white;font-weight:850;font-size:16px;cursor:pointer}.actions .primary{background:#6d5dfc;color:white;border-color:#6d5dfc}.back{display:block;width:100%;margin-top:16px;text-align:center;padding:14px;text-decoration:none;color:#444}@media(max-width:700px){body{padding:12px}.body{grid-template-columns:1fr}.grid{width:min(100%,320px);margin:auto}.head{align-items:flex-start}.reward{font-size:12px}}</style></head><body><main class="wrap"><section class="card"><div class="head"><div><small>DAILY OPTIONAL BONUS</small><h1>Mini Sudoku</h1><p>A quick 4×4 logic puzzle — smaller and friendlier than a regular 9×9 Sudoku.</p></div><div class="reward">🪙 +50</div></div><div class="body"><div id="grid" class="grid"></div><div class="instructions"><h2>How to play</h2><p>Use the numbers <b>1, 2, 3, and 4</b> exactly once in every row, every column, and each 2×2 box. Tap an empty square to cycle its number.</p><p id="message" class="message"></p><div class="actions"><button id="reset">Reset</button><button id="check" class="primary">Check puzzle</button></div><a class="back" href="./">← Back to First Principles</a></div></div></section></main><script>const P=[{g:[[1,0,0,4],[0,4,1,0],[0,1,4,0],[4,0,0,1]],s:[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]]},{g:[[0,2,0,4],[3,0,1,0],[0,1,0,3],[4,0,2,0]],s:[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]]},{g:[[1,0,3,0],[0,4,0,2],[2,0,4,0],[0,3,0,1]],s:[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]]},{g:[[0,0,3,4],[3,4,0,0],[0,0,4,3],[4,3,0,0]],s:[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]]}];const day=new Date().toISOString().slice(0,10),hash=[...day].reduce((a,c)=>a+c.charCodeAt(0),0),p=P[hash%P.length],key='first-principles-sudoku-bonus',msg=document.getElementById('message'),grid=document.getElementById('grid'),check=document.getElementById('check'),reset=document.getElementById('reset');let board=p.g.map(r=>[...r]),won=localStorage.getItem(key)===day;function render(){grid.innerHTML='';board.forEach((row,r)=>row.forEach((v,c)=>{const b=document.createElement('button');b.className='cell '+(p.g[r][c]?'given ':'')+(r===1?'boxBottom ':'')+(c===1?'boxRight':'');b.textContent=v||'';b.disabled=!!p.g[r][c]||won;b.onclick=()=>{board[r][c]=(board[r][c]%4)+1;msg.textContent='Keep going — each number appears once in every row, column, and 2×2 box.';render()};grid.appendChild(b)}));check.disabled=won;reset.disabled=won;check.textContent=won?'Bonus earned ✓':'Check puzzle';msg.className='message'+(won?' won':'');msg.textContent=won?'Today’s +50 coin bonus is already yours. Come back tomorrow for a new puzzle.':'Fill every row, column, and 2×2 box with 1, 2, 3, and 4.'}check.onclick=()=>{const ok=board.every((row,r)=>row.every((v,c)=>v===p.s[r][c]));if(!ok){msg.textContent='Not quite yet. Check rows, columns, and the four 2×2 boxes.';return}localStorage.setItem(key,day);localStorage.setItem('first-principles-pending-coins','50');won=true;render();msg.textContent='Sudoku solved! +50 coins will be added when you return to the app.'};reset.onclick=()=>{board=p.g.map(r=>[...r]);render()};render();</script></body></html>
