<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d5dfc" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="./src/worldPolish.css?v=4" />
    <title>First Principles</title>
    <style>
      #playtest-reset{position:fixed;right:14px;bottom:14px;z-index:9999;border:1px solid #d9dce7;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 6px 22px rgba(32,35,49,.16);padding:9px 13px;font:700 12px/1.2 Inter,system-ui,sans-serif;color:#54596b;cursor:pointer;backdrop-filter:blur(8px)}
      #playtest-reset:hover{background:#fff;border-color:#6d5dfc;color:#4f40e8}
      #reset-dialog{border:0;border-radius:22px;padding:0;max-width:430px;width:calc(100% - 32px);box-shadow:0 20px 70px rgba(28,24,70,.3)}
      #reset-dialog::backdrop{background:rgba(30,32,45,.5);backdrop-filter:blur(3px)}
      .reset-card{padding:24px;font-family:Inter,system-ui,sans-serif;color:#202331}.reset-card h2{margin:4px 0 10px}.reset-card p{line-height:1.5;color:#62687a}.reset-card small{font-weight:800;color:#6d5dfc;text-transform:uppercase;letter-spacing:.08em}.reset-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.reset-actions button{min-height:46px;border-radius:14px;border:1px solid #d9dce7;background:#fff;font:800 14px Inter,system-ui,sans-serif;cursor:pointer}.reset-actions .reset-confirm{background:#6d5dfc;color:#fff;border-color:#6d5dfc}
      .tutorControls{display:none!important}
      .crash-recovery{max-width:680px;margin:80px auto;padding:28px;border:1px solid #e5e7ef;border-radius:24px;background:#fff;box-shadow:0 12px 40px rgba(32,35,49,.09);font-family:Inter,system-ui,sans-serif;color:#202331}.crash-recovery small{font-weight:900;color:#6d5dfc;letter-spacing:.08em}.crash-recovery h1{font-size:34px;margin:8px 0}.crash-recovery p{color:#62687a;line-height:1.5}.crash-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.crash-actions button{min-height:46px;border-radius:14px;border:1px solid #d9dce7;background:#fff;padding:10px 16px;font:800 14px Inter,system-ui,sans-serif;cursor:pointer}.crash-actions .primary-recovery{background:#6d5dfc;color:#fff;border-color:#6d5dfc}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <button id="playtest-reset" type="button">↻ New student</button>
    <dialog id="reset-dialog"><div class="reset-card"><small>Playtest reset</small><h2>Start as a brand-new student?</h2><p>This clears coins, mastery, completed lessons, buildings, and world orders on this browser. The app and curriculum stay unchanged.</p><div class="reset-actions"><button id="reset-cancel" type="button">Keep progress</button><button id="reset-confirm" class="reset-confirm" type="button">Start fresh</button></div></div></dialog>
    <script>
      (()=>{
        const trigger=document.getElementById('playtest-reset'),dialog=document.getElementById('reset-dialog'),cancel=document.getElementById('reset-cancel'),confirm=document.getElementById('reset-confirm');
        trigger.addEventListener('click',()=>dialog.showModal());
        cancel.addEventListener('click',()=>dialog.close());
        confirm.addEventListener('click',()=>{localStorage.removeItem('first-principles-progress-v2');localStorage.removeItem('first-principles-progress-v1');dialog.close();location.href=location.origin+location.pathname});

        let recovering=false;
        const showRecovery=()=>{
          if(recovering)return;
          recovering=true;
          setTimeout(()=>{
            const root=document.getElementById('root');
            if(!root||root.children.length)return;
            root.innerHTML='<section class="crash-recovery"><small>PLAYTEST RECOVERY</small><h1>That lesson hit a bug.</h1><p>Your learning progress is still saved. Reload this lesson, or return to Lesson 1 without erasing your coins, buildings, or completed work.</p><div class="crash-actions"><button class="primary-recovery" id="recover-reload">Reload lesson</button><button id="recover-first">Go to Lesson 1</button></div></section>';
            document.getElementById('recover-reload')?.addEventListener('click',()=>location.reload());
            document.getElementById('recover-first')?.addEventListener('click',()=>{
              try{
                const key='first-principles-progress-v2';
                const saved=JSON.parse(localStorage.getItem(key)||'{}');
                saved.lessonIndex=0;
                localStorage.setItem(key,JSON.stringify(saved));
              }catch{}
              location.reload();
            });
          },50);
        };
        window.addEventListener('error',showRecovery);
        window.addEventListener('unhandledrejection',showRecovery);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
